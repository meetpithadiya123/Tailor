<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- ── Circular HD Favicon & Touch Icons ──────────────────── -->
    <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/logo512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo.png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />

    <!-- ── Viewport & Theming ─────────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7A2E39" />

    <!-- ── SEO ───────────────────────────────────────────────── -->
    <title>Sonali Ladies Tailor — Stitching Your Dreams</title>
    <meta
      name="description"
      content="Sonali Ladies Tailor — Custom stitching for ladies wear. Beautiful blouses, dresses, kurtis, suits, and lehengas crafted with care and perfect fitting. Located in Rajkot, Gujarat."
    />
    <meta name="keywords" content="ladies tailor, custom stitching, blouse stitching, lehenga, kurti, dress stitching, Sonali Ladies Tailor, Rajkot tailor" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sonali-ladies-tailor.vercel.app/" />

    <!-- ── Open Graph ─────────────────────────────────────────── -->
    <meta property="og:title" content="Sonali Ladies Tailor — Stitching Your Dreams" />
    <meta property="og:description" content="Custom ladies' wear stitching with perfect fit and elegant finish. Rajkot, Gujarat." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    <meta property="og:url" content="https://sonali-ladies-tailor.vercel.app/" />

    <!-- ── Security Headers (CSP via meta tag for extra layer) ── -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- ── Performance: DNS Prefetch & Preconnect ─────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://maps.googleapis.com" />

    <!-- ── Google Fonts (display=swap for fast render) ─────────── -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap"
    />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
